fic roles to team members.\n\n**Step 2: Review the permission scheme**\n\n1. Go to **Project settings > Permissions**.\n2. Review actions granted per role (e.g., Browse Projects, Create Issues, Delete Issues).\n3. Verify restricted actions (like Delete Issues) are limited to Administrators."},{"id":"P14","title":"End-to-end Scrum project and Sprint Report","body":"> **Question:** Create and configure a Jira Scrum project. Add team members and roles, create issue types and an Epic with related issues, create and start a sprint, and generate a Sprint Report.\n\n1. **Create project:** Projects > Create project > choose **Scrum** > Name: *Banking App*.\n2. **Add members:** Project settings > People > add members as **Developers**.\n3. **Issue creation:** **+ Create** > add an Epic (*Payment Gateway*), then add child Stories (*Credit Card Support*, *UPI Integration*).\n4. **Sprint execution:** Backlog > move the Stories into the sprint > **Start sprint** (set 2-week duration).\n5. **Generate report:** after completing the work, go to **Reports > Sprint Report** to inspect completed vs non-completed work points."},{"id":"P15","title":"Workflow, JQL, dashboard, automation","body":"> **Question:** Create a Jira project and configure a custom workflow, JQL filters, a dashboard with suitable gadgets, and an automation rule. Demonstrate the configuration and test the automation\n\n1. **Project:** create a new project named *IT Support*.\n2. **Workflow:** add a status *Awaiting Feedback* in Project settings > Workflows (then publish).\n3. **JQL filter:** Filters > Search issues > Switch to JQL > type `project = \"IT Support\" AND priority = High` > Save as *High Priority Support*.\n4. **Dashboard:** create dashboard *IT Summary* > add the **Filter Results** gadget pointing to *High Priority Support*.\n5. **Automation:** create rule: Trigger = **Issue Created** > Action = **Set Assignee to Project Lead**. Test by creating a new issue."},{"id":"P16","title":"Account, dashboard, project setup","body":"> **Question:** Create a Jira Cloud account, explore the dashboard, create a company-managed Scrum or Kanban project, and configure its details.\n\n**Step 1: Create the account and explore**\n\n1. Go to atlassian.com and sign up or log in using a Google or Atlassian account.\n2. Open your Jira Cloud site (the dashboard opens after login).\n3. Explore the default dashboard and its metrics.\n4. Check the top navigation menu: Projects, Filters, Dashboards, People, Apps.\n\n**Step 2: Create a company-managed project**\n\n1. Click **Projects > Create project**.\n2. Choose a **Scrum** or **Kanban** template.\n3. Select **Company-managed project**.\n4. Enter a Name and Key, click **Create project**.\n\n**Step 3: Configure project details**\n\n1. Go to **Project settings > Details**.\n2. Set the **Name**, **URL** and **Avatar**.\n3. Click **Save changes**."},{"id":"P17","title":"Team members and roles","body":"> **Question:** Add team members to a Jira project and assign suitable project roles.\n\n**Step 1: Add team members**\n\n1. Open your project.\n2. Click **Add people** (+ icon) at the top right of the board, or go to **Project settings > People**.\n3. Click **Add people**.\n4. Enter the email addresses of the team members.\n\n**Step 2: Assign project roles**\n\n1. In the **Role** dropdown next to each email, select the role (Developer, Member or Administrator).\n2. Click **Add**.\n3. To change a role later: **Project settings > People**, find the user, click the current role dropdown and choose a new role (e.g., Administrator)."},{"id":"P18","title":"Issue types, components, versions","body":"> **Question:** Create and configure the Epic, Story, Task, and Bug issue types. Create project components and versions.\n\n**Step 1: Configure issue types**\n\n1. Go to **Project settings > Issue types**.\n2. Review the existing issue types: **Epic, Story, Task, Bug**.\n3. Customize the fields of an issue type: drag required fields from the right panel into the issue form layout.\n4. Click **Save changes**.\n\n**Step 2: Create project components**\n\n1. In the left sidebar, click **Components** (or Project settings > Components).\n2. Click **Create component**.\n3. Enter the Component Name (e.g., *Database*).\n4. Add a Description (e.g., *Database related issues and scripts*).\n5. Set the Component Lead and Default Assignee (e.g., Project Lead).\n6. Click **Save**.\n\n**Step 3: Create project versions (releases)**\n\n1. Click **Releases** (or Versions) in the left sidebar.\n2. Click **Create version**.\n3. Enter the version Name (e.g., *Version 1.0*).\n4. Select a Start date and Release date.\n5. Add a Description (e.g., *Initial Major Release*).\n6. Click **Save**."},{"id":"P19","title":"Mobile app status, comment, assignee","body":"> **Question:** Install and configure the Jira mobile app. View an issue and update its status, comment, and assignee.\n\n1. Download **Jira Cloud** from Google Play Store or Apple App Store.\n2. Open the app and log in with your Atlassian account.\n3. Select the target project and open an assigned issue card.\n4. Change the status dropdown to **In Progress**.\n5. Add comment: *Working on this task*.\n6. Reassign to another user via the **Assignee** picker."},{"id":"P20","title":"Scrum project with Epic, 2 Stories, 1 Task","body":"> **Question:** Create a company-managed Scrum project and add an Epic with at least two Stories and one Task.\n\n1. Click **Projects > Create project > Scrum > Company-managed**.\n2. Project Name: *Mobile Wallet*. Key: *MW*.\n3. Click **+ Create** > Issue type: **Epic** > Name: *User Onboarding*. Click **Create**.\n4. Open the Epic > click **+ Add child work item** > add **Story 1** (*User Signup*).\n5. Click **+ Add child work item** > add **Story 2** (*OTP Verification*).\n6. Click **+ Add child work item** > add **Task 1** (*Setup SMS Gateway*)."},{"id":"P21","title":"Create and save JQL filter","body":"> **Question:** Create and save a JQL filter for issues with a selected priority and status, then verify the results\n\n**Step 1: Write the JQL query**\n\n1. Click **Filters** in the top bar > **View all filters** (or Search issues).\n2. Click **Switch to JQL** (if in basic mode).\n3. Enter the query:\n\n   ```jql\n   project = \"MW\" AND priority = High AND status = \"To Do\"\n   ```\n4. Click **Search** (magnifying glass icon).\n\n**Step 2: Save and verify**\n\n1. Click **Save as** above the query box.\n2. Enter Filter Name: *MW High Priority ToDo*. Click **Save**.\n3. Verify that the matching issues display correctly in the results list."},{"id":"P22","title":"Dashboard with issue statistics gadgets","body":"> **Question:** Create a custom dashboard and add gadgets that display issue statistics.\n\n1. Click **Dashboards** in the top menu > **Create dashboard**.\n2. Enter Name: *Management Overview Dashboard* > click **Save**.\n3. Click **Add gadget**.\n4. Search for and add the **Issue Statistics** gadget.\n5. In the gadget settings, select your project, set **Statistic Type** to **Status**, and click **Save**.\n6. Click **Add gadget** again > select **Pie Chart** gadget > set Statistic Type to **Assignee** > click **Save**."},{"id":"P23","title":"Roles and permission access","body":"> **Question:** Configure project roles and review how permissions control access to project activities\n\n1. Go to **Project settings > Permissions**.\n2. View the permission categories (Browse Projects, Create Issues, Administer Projects).\n3. Click **Actions > Edit permissions**.\n4. Find **Delete Issues** > click **Remove** for general roles > grant it only to **Project Role (Administrators)**.\n5. Test with a non-admin account to confirm they cannot delete issues."},{"id":"P24","title":"Automation: assign on creation or transition","body":"> **Question:** Create an automation rule that assigns an issue when it is created or moved to a specified status, then test it.\n\n1. Go to **Project settings > Automation > Create rule**.\n2. **Trigger:** select **Issue created** OR **Issue transitioned** (To: In Progress).\n3. **Condition:** **Issue fields condition** > Field: Assignee > Condition: **is empty**.\n4. **Action:** **Assign issue** > Assign to: **User who triggered the event** (or a specific user).\n5. Name the rule *Auto Assign on Action* > click **Turn it on**.\n6. Test by creating an unassigned issue and moving it to In Progress."},{"id":"P25","title":"Scrum board, sprint, report","body":"> **Question:** Create a Scrum board, add a sprint, move issues into it, start the sprint, and view its report.\n\n1. Go to the **Backlog** menu of your Scrum project.\n2. Click **Create sprint**.\n3. Drag issues from the Backlog into the new Sprint container.\n4. Click **Start sprint**, configure the duration and click **Start**.\n5. Once the sprint is active, move cards on the board to **Done**.\n6. Click **Reports > Sprint Report** to examine progress metrics."},{"id":"P26","title":"Link issues to components and versions","body":"> **Question:** Create project components and versions, then associate relevant issues with them.\n\n1. Go to the **Components** menu > **Create component** *Frontend*.\n2. Go to the **Releases** menu > **Create version** *v1.0*.\n3. Open an issue (e.g., MW-1).\n4. In the right-hand panel, click the **Components** field and select *Frontend*.\n5. Click the **Fix versions** field and select *v1.0*.\n6. Save and verify the fields are populated on the issue card."},{"id":"P27","title":"Filters and issue statistics summary","body":"> **Question:** Use Jira filters and issue statistics to summarize issues by status, assignee, or priority.\n\n1. Go to **Filters > Search issues**.\n2. Switch to Basic or JQL mode and search:\n\n   - By Status: `status = \"In Progress\"`\n   - By Assignee: `assignee = currentUser()`\n   - By Priority: `priority = High`\n3. Click **Change views** to switch to list or detail view.\n4. Export or summarize the data using **Reports > Issue Statistics**."},{"id":"P28","title":"Mobile app with notifications","body":"> **Question:** Use the Jira mobile app to view and update an issue, add a comment, assign it, and check notifications.\n\n1. Open the Jira Mobile App.\n2. Tap the **Bell** icon (Notifications tab) to review recent updates and mentions.\n3. Open an issue assigned to you.\n4. Update the Status to **Done**.\n5. Tap **Assignee** to reassign to a teammate.\n6. Scroll to **Comments**, type a message, tag a user with `@Name`, and tap **Send**."},{"id":"P29","title":"Account, project, details (A, B, C)","body":"> **Question:** A. Create a Jira Cloud account and explore the dashboard. B. Create a Company-managed Scrum/Kanban Project. C. Configure project details.\n\n**A. Account setup**\n\n1. Go to atlassian.com and sign up or log in using a Google or Atlassian account.\n2. Open your Jira Cloud site (the dashboard opens after login).\n3. Explore the default dashboard and its metrics.\n4. Check the top navigation menu: Projects, Filters, Dashboards, People, Apps.\n\n**B. Project creation**\n\n1. Click **Projects > Create project**.\n2. Select the **Scrum** or **Kanban** template.\n3. Select **Company-managed**.\n\n**C. Project details**\n\n1. Go to **Project settings > Details**.\n2. Modify the **Name**, **Key** and **Category**.\n3. Click **Save**."},{"id":"P30","title":"Add members and assign roles (A, B)","body":"> **Question:** A. Add team members. B. Assign roles.\n\n**A. Add team members**\n\n1. Click the **Add people** icon.\n2. Input the team members' emails.\n3. Send the invites.\n\n**B. Assign roles**\n\n1. Go to **Project settings > People**.\n2. Assign roles (Administrator, Member, Viewer) to each user."},{"id":"P31","title":"Custom workflow, conditions, publish (A, B, C)","body":"> **Question:** A. Design a custom workflow. B. Add transitions and conditions. C. Publish and associate workflow with a project.\n\n**A. Design a custom workflow**\n\n1. Go to **Project settings > Workflows**.\n2. Edit the active scheme.\n3. Add custom statuses (*In Review*, *Testing*).\n\n**B. Add transitions and conditions**\n\n1. Click **Add transition**.\n2. Define the From and To statuses.\n3. Click the transition line > **Add condition** (e.g., *Only Assignee can execute*).\n\n**C. Publish and associate**\n\n1. Click **Publish draft**.\n2. Associate the workflow with the project issue types."},{"id":"P32","title":"Scrum board, sprint lifecycle, report (A, B, C)","body":"> **Question:** A. Create and configure Scrum Board. B. Create and start a Sprint. C. Complete Sprint and generate Sprint Report.\n\n**A. Create the Scrum board**\n\n1. Navigate to your Scrum project's backlog panel.\n\n**B. Create and start a sprint**\n\n1. Drag backlog stories into the Sprint container.\n2. Click **Start sprint**.\n3. Define the goal and timeline.\n\n**C. Complete the sprint and report**\n\n1. Move all finished cards to **Done** on the board.\n2. Click **Complete sprint**.\n3. Go to **Reports > Sprint Report**."},{"id":"P33","title":"Burndown, velocity, pie chart, dashboard (A, B, C)","body":"> **Question:** A. Generate Burndown Chart and Velocity Chart. B. Create Pie Chart / Issue Statistics Report. C. Create a Custom Dashboard with gadgets.\n\n**A. Burndown and Velocity charts**\n\n1. Go to **Reports** in the sidebar.\n2. Click **Burndown Chart** to track remaining story points vs the sprint timeline.\n3. Click **Velocity Chart** to analyze story point commitment vs completion across sprints.\n\n**B. Pie Chart and Issue Statistics report**\n\n1. Go to **Reports > Pie Chart Report**.\n2. Select a filter or project > choose the statistic type (Priority or Status) > view the report.\n\n**C. Custom dashboard**\n\n1. Go to **Dashboards > Create dashboard**.\n2. Click **Add gadget** > add **Burndown Chart**, **Pie Chart** and **Assigned to Me** gadgets.\n3. Arrange and **Save**."},{"id":"P34","title":"Permission scheme and roles (A, B)","body":"> **Question:** A. View and modify Project Permission Scheme. B. Configure Project Roles and assign permissions\n\n**A. View and modify the permission scheme**\n\n1. Go to **Project settings > Permissions**.\n2. Click **Actions > Edit permissions**.\n3. Find permissions such as **Close Issues** or **Delete Work Items**.\n4. Grant them only to designated roles or groups.\n\n**B. Configure project roles and assign access**\n\n1. Go to **Project settings > People**.\n2. Create or assign roles (Administrators, Developers, Viewers).\n3. Verify access limits by attempting restricted actions under different user roles."}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const TABS=[['viva','Viva Q&A'],['ai','AI/ML Practicals'],['jira','Jira Practicals']];
const LV=[['all','All'],['E','Easy'],['M','Medium'],['H','Hard']];
const LN={E:'Easy',M:'Medium',H:'Hard'};
let S={tab:'viva',lv:'all',q:'',mode:'list',i:0,show:false,known:new Set()};
try{S.known=new Set(JSON.parse(localStorage.getItem('known')||'[]'))}catch(e){}
try{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>window.marked?marked.parse(s,{breaks:true}):'<pre>'+esc(s)+'</pre>';
function save(){try{localStorage.setItem('known',JSON.stringify([...S.known]))}catch(e){}}
function items(){
  const q=S.q.trim().toLowerCase();
  return D[S.tab].filter(x=>(S.tab!=='viva'||S.lv==='all'||x.level===S.lv)&&(!q||(x.title+' '+x.body).toLowerCase().includes(q)));
}
function addCopy(root){
  root.querySelectorAll('pre').forEach(p=>{
    if(p.querySelector('.cp'))return;
    const b=document.createElement('button');b.className='cp';b.textContent='Copy';
    b.onclick=()=>{const t=p.querySelector('code')?p.querySelector('code').innerText:p.innerText;
      try{navigator.clipboard.writeText(t);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}catch(e){}};
    p.appendChild(b);
  });
}
function chrome(){
  $('tabs').innerHTML='';
  TABS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n+' ('+D[k].length+')';
    if(k===S.tab)b.className='on';b.onclick=()=>{S.tab=k;S.i=0;S.show=false;if(k!=='viva')S.mode='list';draw()};$('tabs').appendChild(b)});
  $('levels').innerHTML='';$('modes').innerHTML='';
  if(S.tab==='viva'){
    LV.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;if(k===S.lv)b.className='on';
      b.onclick=()=>{S.lv=k;S.i=0;S.show=false;draw()};$('levels').appendChild(b)});
    [['list','List view'],['cards','Flashcard mode']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;
      if(k===S.mode)b.className='on';b.onclick=()=>{S.mode=k;S.i=0;S.show=false;draw()};$('modes').appendChild(b)});
  }
}
function progress(list){
  if(S.tab!=='viva'){$('barw').style.display='none';return}
  $('barw').style.display='block';
  const all=D.viva.filter(x=>S.lv==='all'||x.level===S.lv);
  const n=all.filter(x=>S.known.has(x.id)).length;
  $('bar').style.width=(all.length?n/all.length*100:0)+'%';
  return n+' of '+all.length+' marked as learned';
}
function listView(list){
  const out=$('out');out.innerHTML='';
  if(!list.length){out.innerHTML='<div class="empty">Nothing matches your search.</div>';return}
  list.forEach(x=>{
    const d=document.createElement('details');
    const lv=x.level||'X';
    const tag=x.level?LN[x.level]:x.id;
    d.innerHTML='<summary><span class="tag t-'+lv+'">'+(x.level?x.id+' · '+tag:x.id)+'</span><span>'+esc(x.title)+(x.topic?'<br><span class="topic">'+esc(x.topic)+'</span>':'')+'</span></summary><div class="body"></div>';
    d.addEventListener('toggle',()=>{
      const b=d.querySelector('.body');
      if(d.open&&!b.dataset.r){b.innerHTML=md(x.body)+(S.tab==='viva'?'<label class="k"><input type="checkbox" '+(S.known.has(x.id)?'checked':'')+'> I know this one</label>':'');b.dataset.r=1;addCopy(b);
        const c=b.querySelector('input');if(c)c.onchange=()=>{c.checked?S.known.add(x.id):S.known.delete(x.id);save();$('stat').textContent=list.length+' shown · '+progress(list);}}
    });
    if(S.q.trim()&&list.length<=3){d.open=true}
    out.appendChild(d);
  });
}
function cardView(list){
  const out=$('out');
  if(!list.length){out.innerHTML='<div class="empty">Nothing matches your search.</div>';return}
  if(S.i>=list.length)S.i=0;
  const x=list[S.i];
  out.innerHTML='<div class="card"><span class="tag t-'+x.level+'">'+LN[x.level]+'</span> <span class="topic">'+esc(x.topic)+' · '+(S.i+1)+' / '+list.length+'</span><div class="q">'+esc(x.title)+'</div><div id="ans"></div></div><div class="row" id="ctl"></div>';
  const ans=$('ans');
  if(S.show){ans.innerHTML=md(x.body);addCopy(ans)}
  const ctl=$('ctl');
  const mk=(t,f,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;ctl.appendChild(b)};
  mk('Previous',()=>{S.i=(S.i-1+list.length)%list.length;S.show=false;draw()});
  mk(S.show?'Hide answer':'Show answer',()=>{S.show=!S.show;draw()},'on');
  mk(S.known.has(x.id)?'Unmark learned':'Mark as learned',()=>{S.known.has(x.id)?S.known.delete(x.id):S.known.add(x.id);save();draw()},S.known.has(x.id)?'ok':'');
  mk('Next',()=>{S.i=(S.i+1)%list.length;S.show=false;draw()});
  mk('Random',()=>{S.i=Math.floor(Math.random()*list.length);S.show=false;draw()});
}
function draw(){
  chrome();
  const list=items();
  const p=progress(list);
  $('stat').textContent=list.length+' shown'+(p?' · '+p:'');
  if(S.tab==='viva'&&S.mode==='cards')cardView(list);else listView(list);
}
$('q').addEventListener('input',e=>{S.q=e.target.value;S.i=0;S.show=false;draw()});
draw();
</script>
</body>
</html>
